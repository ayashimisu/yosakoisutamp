<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>超幕末 土佐よさ恋スタンプ帳</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0D0D0D; color: #E8DCC8; font-family: 'Noto Serif JP','Hiragino Mincho ProN',serif; min-height:100vh; padding-bottom:40px; }
  header { position:sticky; top:0; z-index:50; padding:14px 20px 10px; border-bottom:1px solid rgba(200,134,10,0.3); background:rgba(13,13,13,0.97); }
  .header-label { font-size:10px; letter-spacing:0.3em; color:#C8860A; }
  .header-title { font-size:18px; font-weight:900; letter-spacing:0.15em; margin:2px 0; }
  .header-count { font-size:11px; color:#8A7A60; }
  .section { margin:14px; }
  .gps-bar { background:rgba(30,25,10,0.7); border:1px solid rgba(200,134,10,0.3); border-radius:10px; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; }
  .gps-bar.active { background:rgba(10,40,10,0.7); border-color:rgba(80,180,80,0.4); }
  .gps-status { font-size:11px; letter-spacing:0.15em; }
  .gps-status.on { color:#80D880; } .gps-status.off { color:#C8860A; }
  .gps-coords { font-size:10px; color:#5A5040; margin-top:3px; }
  .gps-error { font-size:10px; color:#D06060; margin-top:3px; }
  button { font-family:'Noto Serif JP',serif; cursor:pointer; border:none; border-radius:8px; padding:9px 16px; font-size:12px; letter-spacing:0.1em; }
  .btn-gps-start { background:rgba(200,134,10,0.8); color:#0D0D0D; font-weight:700; }
  .btn-gps-stop  { background:rgba(180,40,40,0.7); color:#E8DCC8; }
  /* モード切り替え */
  .mode-bar { display:flex; gap:8px; align-items:center; }
  .mode-btn { flex:1; padding:10px; border-radius:8px; font-size:12px; font-weight:700; letter-spacing:0.1em; border:1px solid transparent; background:rgba(30,25,10,0.7); color:#6A5A40; }
  .mode-btn.active-normal { background:rgba(30,80,30,0.7); color:#80D880; border-color:rgba(80,180,80,0.4); }
  .mode-btn.active-hard   { background:rgba(80,20,20,0.7); color:#D08080; border-color:rgba(180,60,60,0.4); }
  .mode-note { font-size:10px; color:#6A5A40; text-align:center; margin-top:6px; letter-spacing:0.1em; }
  .nearby-card { border-radius:14px; padding:18px; animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.85} }
  .nearby-top { display:flex; align-items:center; gap:14px; margin-bottom:14px; }
  .nearby-emoji { font-size:40px; }
  .nearby-label { font-size:10px; letter-spacing:0.2em; margin-bottom:3px; }
  .nearby-name  { font-size:17px; font-weight:900; margin-bottom:4px; }
  .nearby-chara { font-size:11px; margin-bottom:3px; }
  .nearby-msg   { font-size:11px; color:#8A7A60; font-style:italic; line-height:1.6; }
  .nearby-mode  { font-size:9px; letter-spacing:0.15em; margin-top:4px; }
  .btn-stamp { width:100%; padding:14px; font-size:14px; font-weight:900; letter-spacing:0.2em; }
  .btn-stamp:disabled { background:rgba(60,60,60,0.5)!important; color:#5A5A5A!important; cursor:not-allowed; }
  .debug-panel { background:rgba(15,15,35,0.7); border:1px solid rgba(100,100,200,0.3); border-radius:10px; padding:12px 14px; }
  .debug-label { font-size:10px; color:#8080C0; letter-spacing:0.2em; margin-bottom:8px; }
  .debug-btns  { display:flex; flex-wrap:wrap; gap:5px; }
  .btn-debug { font-size:9px; padding:4px 8px; border-radius:4px; background:rgba(40,40,80,0.6); color:#8080A0; border:1px solid rgba(100,100,200,0.2); }
  .btn-debug.active { color:#C0C0FF; border-color:rgba(150,150,255,0.5); background:rgba(60,60,120,0.6); }
  .char-tabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .char-tab { font-size:10px; padding:5px 10px; border-radius:20px; background:rgba(30,25,15,0.8); color:#6A5A40; border:1px solid rgba(100,80,30,0.3); cursor:pointer; }
  .char-tab.active { color:#E8DCC8; border-color:rgba(200,134,10,0.6); background:rgba(50,40,10,0.8); }
  .stamp-book { background:rgba(15,10,5,0.7); border:1px solid rgba(200,134,10,0.2); border-radius:14px; padding:16px; }
  .stamp-book-title { font-size:11px; letter-spacing:0.25em; color:#C8860A; padding-bottom:10px; margin-bottom:14px; border-bottom:1px solid rgba(200,134,10,0.2); display:flex; justify-content:space-between; align-items:center; }
  .stamp-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .stamp-item { display:flex; flex-direction:column; align-items:center; padding:12px 8px; border-radius:10px; border:1px solid rgba(80,70,50,0.3); background:rgba(25,20,15,0.6); opacity:0.5; transition:all 0.4s; }
  .stamp-item.got { opacity:1; }
  .stamp-emoji { font-size:28px; margin-bottom:6px; filter:grayscale(1); transition:filter 0.4s; }
  .stamp-item.got .stamp-emoji { filter:none; }
  .stamp-name { font-size:10px; text-align:center; color:#5A5040; line-height:1.4; }
  .stamp-item.got .stamp-name { color:#E8DCC8; }
  .stamp-chara { font-size:9px; text-align:center; color:#4A4030; margin-top:2px; }
  .stamp-item.got .stamp-chara { color:#8A7060; }
  .stamp-dist { font-size:9px; color:#4A4030; margin-top:3px; }
  .stamp-done { font-size:9px; margin-top:3px; letter-spacing:0.1em; }
  .popup-overlay { position:fixed; inset:0; z-index:100; background:rgba(0,0,0,0.8); display:flex; align-items:center; justify-content:center; animation:fadeIn 0.3s ease; }
  @keyframes fadeIn { from{opacity:0;transform:scale(.85)} to{opacity:1;transform:scale(1)} }
  .popup-card { border-radius:20px; padding:32px 24px; text-align:center; max-width:290px; width:90%; }
  .popup-emoji { font-size:56px; margin-bottom:8px; }
  .popup-badge { font-size:11px; letter-spacing:0.3em; margin-bottom:4px; }
  .popup-name  { font-size:18px; font-weight:900; color:#E8DCC8; margin-bottom:4px; }
  .popup-chara { font-size:11px; margin-bottom:8px; }
  .popup-mode  { font-size:10px; letter-spacing:0.15em; margin-top:8px; }
</style>
</head>
<body>
<header>
  <div class="header-label">超幕末</div>
  <div class="header-title">土佐よさ恋スタンプ帳</div>
  <div class="header-count" id="countLabel">0 / 27 取得</div>
</header>

<div class="section">
  <div class="gps-bar" id="gpsBar">
    <div>
      <div class="gps-status off" id="gpsStatus">○ GPS停止中</div>
      <div class="gps-coords" id="gpsCoords"></div>
      <div class="gps-error"  id="gpsError"></div>
    </div>
    <button class="btn-gps-start" id="gpsBtn" onclick="toggleGPS()">GPS開始</button>
  </div>
</div>

<!-- モード切り替え -->
<div class="section">
  <div class="mode-bar">
    <button class="mode-btn active-normal" id="btnNormal" onclick="setMode('normal')">🗾 ノーマル</button>
    <button class="mode-btn" id="btnHard"   onclick="setMode('hard')">⚔️ ハード</button>
  </div>
  <div class="mode-note" id="modeNote">ノーマル：遠方スポットは市町村エリアで判定</div>
</div>

<div class="section" id="nearbySection"></div>

<!-- デバッグ（高知市外スポットのみ） -->
<div class="section">
  <div class="debug-panel">
    <div class="debug-label">🛸 デバッグ：市町村外スポットのシミュレート</div>
    <div class="debug-btns" id="debugBtns"></div>
  </div>
</div>

<div class="section">
  <div class="stamp-book">
    <div class="stamp-book-title">
      <span>スタンプ帳</span>
      <span id="filterLabel" style="font-size:10px;color:#8A7A60;">全て表示</span>
    </div>
    <div class="char-tabs" id="charTabs"></div>
    <div class="stamp-grid" id="stampGrid"></div>
  </div>
</div>

<div id="popupArea"></div>

<script>
const CHARS = {
  yoshida:  { name:"吉田東洋",    emoji:"📜", color:"#4A7A8A" },
  itagaki:  { name:"板垣退助",    emoji:"✊", color:"#8A6A20" },
  goto:     { name:"後藤象二郎",  emoji:"🕶️", color:"#5B8FA8" },
  ryoma:    { name:"坂本龍馬",    emoji:"⚓", color:"#C8860A" },
  nakaoka:  { name:"中岡慎太郎",  emoji:"👊", color:"#7B3F3F" },
  takechi:  { name:"武市半平太",  emoji:"⚔️", color:"#3D5A3E" },
  izo:      { name:"岡田以蔵",    emoji:"🍡", color:"#6B4F8A" },
  iwasaki:  { name:"岩崎弥太郎",  emoji:"💴", color:"#4A6A4A" },
  manjiro:  { name:"ジョン万次郎",emoji:"🌊", color:"#2A6A8A" },
  yodo:     { name:"山内容堂",    emoji:"🍶", color:"#7A3A3A" },
  tani:     { name:"谷干城",      emoji:"🏯", color:"#8B6914" },
};

// outer:true = 高知市外スポット（ノーマルモードで半径5000m）
const SPOTS = [
  { id:"yoshida_junan",    char:"yoshida",  name:"吉田東洋殉難之地",        lat:33.5608629, lng:133.5377231, radius:80,  outer:false },
  { id:"itagaki_tei",      char:"itagaki",  name:"板垣退助邸跡",             lat:33.5459326, lng:133.5595752, radius:80,  outer:false },
  { id:"itagaki_zo",       char:"itagaki",  name:"板垣退助先生像",           lat:33.5608167, lng:133.5325594, radius:80,  outer:false },
  { id:"itagaki_tanjo",    char:"itagaki",  name:"板垣退助先生誕生の地",     lat:33.5581292, lng:133.5371238, radius:80,  outer:false },
  { id:"goto_tanjo",       char:"goto",     name:"後藤象二郎先生誕生之地",   lat:33.5564524, lng:133.5372246, radius:80,  outer:false },
  { id:"goto_minken",      char:"goto",     name:"高知市立自由民権記念館",   lat:33.5431310, lng:133.5502860, radius:100, outer:false },
  { id:"ryoma_tanjo",      char:"ryoma",    name:"坂本龍馬誕生地",           lat:33.5571713, lng:133.5259210, radius:80,  outer:false },
  { id:"ryoma_saitaniya",  char:"ryoma",    name:"才谷屋跡",                 lat:33.5568995, lng:133.5222595, radius:80,  outer:false },
  { id:"ryoma_machi",      char:"ryoma",    name:"龍馬の生まれたまち記念館", lat:33.5565000, lng:133.5245000, radius:100, outer:false },
  { id:"ryoma_museum",     char:"ryoma",    name:"高知県立坂本龍馬記念館",   lat:33.4964655, lng:133.5719482, radius:100, outer:false },
  { id:"ryoma_zo",         char:"ryoma",    name:"坂本龍馬像",               lat:33.4986187, lng:133.5754821, radius:100, outer:false },
  { id:"nakaoka_kan",      char:"nakaoka",  name:"中岡慎太郎館",             lat:33.4564402, lng:134.0569584, radius:100, outer:true  },
  { id:"nakaoka_seika",    char:"nakaoka",  name:"中岡慎太郎生家",           lat:33.4571961, lng:134.0561382, radius:100, outer:true  },
  { id:"nakaoka_zo",       char:"nakaoka",  name:"中岡慎太郎之像",           lat:33.2457735, lng:134.1762621, radius:100, outer:true  },
  { id:"takechi_junsetsu", char:"takechi",  name:"武市瑞山殉節の地の碑",     lat:33.5598891, lng:133.5355396, radius:80,  outer:false },
  { id:"takechi_tei",      char:"takechi",  name:"武市半平太邸跡",           lat:33.5602837, lng:133.5478792, radius:80,  outer:false },
  { id:"izo_momiji",       char:"izo",      name:"紅葉橋",                   lat:33.5523743, lng:133.5051352, radius:100, outer:false },
  { id:"izo_haka",         char:"izo",      name:"岡田以蔵の墓",             lat:33.5803490, lng:133.5521741, radius:100, outer:false },
  { id:"iwasaki_zo",       char:"iwasaki",  name:"岩崎弥太郎像",             lat:33.5258400, lng:133.9004710, radius:100, outer:true  },
  { id:"iwasaki_seika",    char:"iwasaki",  name:"岩崎弥太郎生家",           lat:33.5260380, lng:133.8999868, radius:100, outer:true  },
  { id:"manjiro_kan",      char:"manjiro",  name:"ジョン万次郎資料館",       lat:32.7813734, lng:132.9326612, radius:100, outer:true  },
  { id:"manjiro_seika",    char:"manjiro",  name:"ジョン万次郎生家",         lat:32.7593775, lng:132.9645816, radius:100, outer:true  },
  { id:"manjiro_zo",       char:"manjiro",  name:"中浜万次郎像",             lat:32.7255834, lng:133.0195690, radius:100, outer:true  },
  { id:"yodo_tei",         char:"yodo",     name:"山内容堂邸跡",             lat:33.5562204, lng:133.5328997, radius:80,  outer:false },
  { id:"yodo_tanjo",       char:"yodo",     name:"山内容堂公誕生之地の碑",   lat:33.5609440, lng:133.5345901, radius:80,  outer:false },
  { id:"yodo_kochi",       char:"yodo",     name:"高知城",                   lat:33.5608125, lng:133.5314844, radius:150, outer:false },
  { id:"tani_figure",      char:"tani",     name:"谷干城フィギュア像",       lat:33.2087536, lng:133.1360827, radius:100, outer:true  },
  { id:"tani_tanjo",       char:"tani",     name:"谷干城生誕地石碑",         lat:33.2100660, lng:133.1318160, radius:100, outer:true  },
];

const NORMAL_RADIUS = 5000; // ノーマルモードの市町村外判定半径

function getEffectiveRadius(spot, mode) {
  return (mode === 'normal' && spot.outer) ? NORMAL_RADIUS : spot.radius;
}

function loadStamps() {
  try { const r=localStorage.getItem("stamps_v1"); if(r) return JSON.parse(r); } catch(e){}
  const init={}; SPOTS.forEach(s=>init[s.id]=false); return init;
}
function saveStamps(s){ try{localStorage.setItem("stamps_v1",JSON.stringify(s));}catch(e){} }

// モードもlocalStorageで保存
function loadMode(){ try{ return localStorage.getItem("mode_v1")||"normal"; }catch(e){return "normal";} }
function saveMode(m){ try{localStorage.setItem("mode_v1",m);}catch(e){} }

let stamps=loadStamps();
let mode=loadMode();
let userPos=null, watchId=null, tracking=false;
let debugSpot=null, distances={}, nearbySpot=null, filterChar="all";

function getDistance(la1,ln1,la2,ln2){
  const R=6371000, dL=(la2-la1)*Math.PI/180, dG=(ln2-ln1)*Math.PI/180;
  const a=Math.sin(dL/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dG/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function updateDistances(){
  const pos=debugSpot||userPos;
  if(!pos){distances={};nearbySpot=null;renderNearby();renderGrid();return;}
  let closest=null,minDist=Infinity;
  SPOTS.forEach(s=>{
    const d=getDistance(pos.lat,pos.lng,s.lat,s.lng);
    distances[s.id]=Math.round(d);
    if(d<minDist){minDist=d;closest=s;}
  });
  const r=getEffectiveRadius(closest,mode);
  nearbySpot=(minDist<=r)?closest:null;
  renderNearby();renderGrid();
}

function setMode(m){
  mode=m;
  saveMode(m);
  document.getElementById("btnNormal").className="mode-btn"+(m==="normal"?" active-normal":"");
  document.getElementById("btnHard").className  ="mode-btn"+(m==="hard"  ?" active-hard":"");
  document.getElementById("modeNote").textContent=
    m==="normal"?"ノーマル：遠方スポットは市町村エリアで判定":
                  "ハード：全スポット史跡の前100m以内で判定";
  updateDistances();
}

function toggleGPS(){tracking?stopGPS():startGPS();}
function startGPS(){
  if(!navigator.geolocation){document.getElementById("gpsError").textContent="GPSに対応していません";return;}
  watchId=navigator.geolocation.watchPosition(
    pos=>{
      userPos={lat:pos.coords.latitude,lng:pos.coords.longitude};
      document.getElementById("gpsCoords").textContent=userPos.lat.toFixed(5)+", "+userPos.lng.toFixed(5);
      document.getElementById("gpsError").textContent="";
      updateDistances();
    },
    err=>{document.getElementById("gpsError").textContent="GPS取得失敗: "+err.message;},
    {enableHighAccuracy:true,maximumAge:5000}
  );
  tracking=true;
  document.getElementById("gpsStatus").textContent="● GPS追跡中";
  document.getElementById("gpsStatus").className="gps-status on";
  document.getElementById("gpsBar").className="gps-bar active";
  document.getElementById("gpsBtn").textContent="停止";
  document.getElementById("gpsBtn").className="btn-gps-stop";
}
function stopGPS(){
  if(watchId!==null)navigator.geolocation.clearWatch(watchId);
  tracking=false;userPos=null;watchId=null;
  document.getElementById("gpsStatus").textContent="○ GPS停止中";
  document.getElementById("gpsStatus").className="gps-status off";
  document.getElementById("gpsBar").className="gps-bar";
  document.getElementById("gpsBtn").textContent="GPS開始";
  document.getElementById("gpsBtn").className="btn-gps-start";
  document.getElementById("gpsCoords").textContent="";
  updateDistances();
}

function setDebug(id){
  debugSpot=id?SPOTS.find(s=>s.id===id):null;
  document.querySelectorAll(".btn-debug").forEach(b=>b.classList.remove("active"));
  if(id)document.getElementById("dbg_"+id)?.classList.add("active");
  updateDistances();
}

function getStamp(){
  if(!nearbySpot||stamps[nearbySpot.id])return;
  stamps[nearbySpot.id]=true;
  saveStamps(stamps);
  showPopup(nearbySpot);
  renderNearby();renderGrid();renderCount();
}

function showPopup(spot){
  const c=CHARS[spot.char];
  const modeLabel=mode==="hard"?"⚔️ ハードモード取得":"🗾 ノーマルモード取得";
  const modeColor=mode==="hard"?"#D08080":"#80D880";
  document.getElementById("popupArea").innerHTML=`
    <div class="popup-overlay" onclick="closePopup()">
      <div class="popup-card" style="background:linear-gradient(135deg,#1A1208,#0D0D0D);border:2px solid ${c.color};box-shadow:0 0 60px ${c.color}40">
        <div class="popup-emoji">${c.emoji}</div>
        <div class="popup-badge" style="color:${c.color}">スタンプ取得！</div>
        <div class="popup-name">${spot.name}</div>
        <div class="popup-chara" style="color:${c.color}">${c.name}</div>
        <div class="popup-mode" style="color:${modeColor}">${modeLabel}</div>
      </div>
    </div>`;
  setTimeout(closePopup,3000);
}
function closePopup(){document.getElementById("popupArea").innerHTML="";}

function setFilter(char){
  filterChar=char;
  document.querySelectorAll(".char-tab").forEach(t=>t.classList.remove("active"));
  document.getElementById("tab_"+char)?.classList.add("active");
  document.getElementById("filterLabel").textContent=char==="all"?"全て表示":CHARS[char]?.name;
  renderGrid();
}

function renderCount(){
  const n=Object.values(stamps).filter(Boolean).length;
  document.getElementById("countLabel").textContent=n+" / "+SPOTS.length+" 取得";
}

function renderNearby(){
  const sec=document.getElementById("nearbySection");
  if(!nearbySpot){sec.innerHTML="";return;}
  const s=nearbySpot,c=CHARS[s.char],got=stamps[s.id];
  const modeLabel=mode==="hard"?"⚔️ ハードモード":"🗾 ノーマルモード";
  const modeColor=mode==="hard"?"#D08080":"#80D880";
  sec.innerHTML=`
    <div class="nearby-card" style="background:linear-gradient(135deg,${c.color}22,${c.color}0A);border:1px solid ${c.color}60">
      <div class="nearby-top">
        <div class="nearby-emoji">${c.emoji}</div>
        <div>
          <div class="nearby-label" style="color:${c.color}">ここにスポットがあります！</div>
          <div class="nearby-name">${s.name}</div>
          <div class="nearby-chara" style="color:${c.color}">${c.name}</div>
          <div class="nearby-mode" style="color:${modeColor}">${modeLabel}</div>
        </div>
      </div>
      <button class="btn-stamp"
        style="background:${got?"rgba(60,60,60,0.5)":`linear-gradient(135deg,${c.color},${c.color}99)`};color:${got?"#5A5A5A":"#0D0D0D"}"
        ${got?"disabled":""} onclick="getStamp()">
        ${got?"✓ 取得済み":"🔖 スタンプを押す"}
      </button>
    </div>`;
}

function renderGrid(){
  const filtered=filterChar==="all"?SPOTS:SPOTS.filter(s=>s.char===filterChar);
  document.getElementById("stampGrid").innerHTML=filtered.map(s=>{
    const c=CHARS[s.char],got=stamps[s.id],d=distances[s.id];
    const r=getEffectiveRadius(s,mode);
    const distHtml=(!got&&d!==undefined)?`<div class="stamp-dist">約${d>1000?(d/1000).toFixed(1)+"km":d+"m"}</div>`:"";
    const doneHtml=got?`<div class="stamp-done" style="color:${c.color}">取得済</div>`:"";
    return `<div class="stamp-item ${got?"got":""}" style="${got?`background:${c.color}18;border-color:${c.color}50`:""}">
      <div class="stamp-emoji">${c.emoji}</div>
      <div class="stamp-name">${s.name}</div>
      <div class="stamp-chara">${c.name}${s.outer?" 🗾":""}</div>
      ${distHtml}${doneHtml}
    </div>`;
  }).join("");
}

function renderCharTabs(){
  const all=`<button id="tab_all" class="char-tab active" onclick="setFilter('all')">全員</button>`;
  const tabs=Object.entries(CHARS).map(([k,c])=>
    `<button id="tab_${k}" class="char-tab" onclick="setFilter('${k}')">${c.emoji}${c.name}</button>`
  ).join("");
  document.getElementById("charTabs").innerHTML=all+tabs;
}

function renderDebugBtns(){
  // デバッグは高知市外スポットのみ
  const outerSpots=SPOTS.filter(s=>s.outer);
  document.getElementById("debugBtns").innerHTML=
    `<button class="btn-debug" onclick="setDebug(null)">リセット</button>`+
    outerSpots.map(s=>`<button id="dbg_${s.id}" class="btn-debug" onclick="setDebug('${s.id}')">${CHARS[s.char].emoji}${s.name.slice(0,6)}</button>`).join("");
}

// 初期化
setMode(mode);
renderCharTabs();
renderDebugBtns();
renderCount();
renderGrid();
</script>
</body>
</html>
