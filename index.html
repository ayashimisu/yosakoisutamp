<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>超幕末 土佐よさ恋スタンプ帳</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0D0D0D; color: #E8DCC8; font-family: 'Noto Serif JP','Hiragino Mincho ProN',serif; min-height:100vh; }

  header { position:sticky; top:0; z-index:1000; padding:12px 20px 8px; border-bottom:1px solid rgba(200,134,10,0.3); background:rgba(13,13,13,0.97); }
  .header-label { font-size:10px; letter-spacing:0.3em; color:#C8860A; }
  .header-title { font-size:18px; font-weight:900; letter-spacing:0.15em; margin:2px 0; }
  .header-count { font-size:11px; color:#C8B89A; }

  /* タブ */
  .tab-bar { display:flex; background:rgba(20,15,8,0.97); border-bottom:1px solid rgba(200,134,10,0.2); position:sticky; top:72px; z-index:999; }
  .tab-btn { flex:1; padding:11px; font-size:12px; font-weight:700; letter-spacing:0.1em; font-family:'Noto Serif JP',serif; cursor:pointer; border:none; background:transparent; color:#8A7A60; border-bottom:2px solid transparent; }
  .tab-btn.active { color:#C8860A; border-bottom:2px solid #C8860A; }

  /* GPS バー */
  .gps-bar { background:rgba(45,38,18,0.9); border:1px solid rgba(200,134,10,0.4); border-radius:10px; padding:11px 14px; display:flex; align-items:center; justify-content:space-between; margin:14px; }
  .gps-bar.active { background:rgba(15,50,15,0.9); border-color:rgba(80,200,80,0.5); }
  .gps-status { font-size:11px; letter-spacing:0.15em; }
  .gps-status.on { color:#60F060; } .gps-status.off { color:#E8A030; }
  .gps-coords { font-size:10px; color:#A89878; margin-top:3px; }
  .gps-town   { font-size:11px; color:#F0C040; margin-top:3px; font-weight:700; }
  .gps-error  { font-size:10px; color:#FF6060; margin-top:3px; }
  button { font-family:'Noto Serif JP',serif; cursor:pointer; border:none; border-radius:8px; padding:9px 16px; font-size:12px; letter-spacing:0.1em; }
  .btn-gps-start { background:rgba(220,150,20,0.9); color:#0D0D0D; font-weight:700; }
  .btn-gps-stop  { background:rgba(200,50,50,0.8); color:#FFFFFF; }

  /* モード */
  .mode-bar { display:flex; gap:8px; margin:0 14px 14px; }
  .mode-btn { flex:1; padding:10px; border-radius:8px; font-size:12px; font-weight:700; letter-spacing:0.1em; border:1px solid transparent; background:rgba(45,38,18,0.9); color:#C8A870; }
  .mode-btn.active-normal { background:rgba(20,70,20,0.9); color:#60F060; border-color:rgba(80,200,80,0.5); }
  .mode-btn.active-hard   { background:rgba(90,20,20,0.9); color:#FF8080; border-color:rgba(200,60,60,0.5); }
  .mode-note { font-size:10px; color:#C8A870; text-align:center; margin:0 14px 14px; }

  /* 地図タブ */
  #tab-map { display:none; flex-direction:column; height:calc(100vh - 120px); }
  #tab-map.show { display:flex; }
  #map { flex:1; z-index:1; }

  /* 地図上の近隣リスト */
  #mapNearby { background:rgba(13,13,13,0.95); border-top:1px solid rgba(200,134,10,0.3); max-height:220px; overflow-y:auto; padding:10px 14px; }

  /* スタンプ帳タブ */
  #tab-stamp { display:none; padding-bottom:40px; }
  #tab-stamp.show { display:block; }

  .section { margin:14px; }
  .nearby-section-title { font-size:10px; letter-spacing:0.2em; color:#C8860A; margin-bottom:8px; }
  .nearby-list { display:flex; flex-direction:column; gap:8px; }
  .nearby-item { border-radius:12px; padding:12px 14px; border:1px solid rgba(80,70,50,0.4); background:rgba(35,28,18,0.9); }
  .nearby-item.in-range { animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.88} }
  .nearby-item-top { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .nearby-item-emoji { font-size:24px; }
  .nearby-item-info { flex:1; }
  .nearby-item-name  { font-size:13px; font-weight:900; }
  .nearby-item-chara { font-size:10px; margin-top:2px; }
  .nearby-item-dist  { font-size:12px; font-weight:700; text-align:right; white-space:nowrap; }
  .nearby-item-dist.close { color:#60F060; }
  .nearby-item-dist.far   { color:#C8A870; }
  .btn-stamp-sm { width:100%; padding:10px; font-size:13px; font-weight:900; letter-spacing:0.15em; border-radius:8px; }
  .btn-stamp-sm:disabled { background:rgba(60,60,60,0.5)!important; color:#5A5A5A!important; cursor:not-allowed; }

  .debug-panel { background:rgba(25,25,55,0.9); border:1px solid rgba(100,100,200,0.3); border-radius:10px; padding:12px 14px; }
  .debug-label { font-size:10px; color:#B0B0E0; letter-spacing:0.2em; margin-bottom:8px; }
  .debug-btns  { display:flex; flex-wrap:wrap; gap:5px; }
  .btn-debug { font-size:9px; padding:4px 8px; border-radius:4px; background:rgba(50,50,100,0.8); color:#B0B0D0; border:1px solid rgba(100,100,200,0.2); }
  .btn-debug.active { color:#C0C0FF; border-color:rgba(150,150,255,0.5); background:rgba(60,60,120,0.8); }

  .char-tabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .char-tab { font-size:10px; padding:5px 10px; border-radius:20px; background:rgba(35,28,18,0.9); color:#C8A870; border:1px solid rgba(100,80,30,0.4); cursor:pointer; }
  .char-tab.active { color:#E8DCC8; border-color:rgba(200,134,10,0.7); background:rgba(60,45,10,0.9); }
  .stamp-book { background:rgba(25,18,8,0.9); border:1px solid rgba(200,134,10,0.3); border-radius:14px; padding:16px; }
  .stamp-book-title { font-size:11px; letter-spacing:0.25em; color:#C8860A; padding-bottom:10px; margin-bottom:14px; border-bottom:1px solid rgba(200,134,10,0.2); display:flex; justify-content:space-between; align-items:center; }
  .stamp-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .stamp-item { display:flex; flex-direction:column; align-items:center; padding:12px 8px; border-radius:10px; border:1px solid rgba(80,70,50,0.4); background:rgba(35,28,18,0.9); opacity:0.5; transition:all 0.4s; }
  .stamp-item.got { opacity:1; }
  .stamp-emoji { font-size:28px; margin-bottom:6px; filter:grayscale(1); transition:filter 0.4s; }
  .stamp-item.got .stamp-emoji { filter:none; }
  .stamp-name  { font-size:10px; text-align:center; color:#D0C0A0; line-height:1.4; }
  .stamp-item.got .stamp-name { color:#E8DCC8; }
  .stamp-chara { font-size:9px; text-align:center; color:#B0A080; margin-top:2px; }
  .stamp-item.got .stamp-chara { color:#D0B890; }
  .stamp-dist  { font-size:9px; color:#B0A080; margin-top:3px; }
  .stamp-done  { font-size:9px; margin-top:3px; letter-spacing:0.1em; }

  .popup-overlay { position:fixed; inset:0; z-index:2000; background:rgba(0,0,0,0.8); display:flex; align-items:center; justify-content:center; animation:fadeIn 0.3s ease; }
  @keyframes fadeIn { from{opacity:0;transform:scale(.85)} to{opacity:1;transform:scale(1)} }
  .popup-card { border-radius:20px; padding:32px 24px; text-align:center; max-width:290px; width:90%; }
  .popup-emoji { font-size:56px; margin-bottom:8px; }
  .popup-badge { font-size:11px; letter-spacing:0.3em; margin-bottom:4px; }
  .popup-name  { font-size:18px; font-weight:900; color:#E8DCC8; margin-bottom:4px; }
  .popup-chara { font-size:11px; margin-bottom:8px; }
  .popup-mode  { font-size:10px; letter-spacing:0.15em; margin-top:8px; }

  /* leafletポップアップ上書き */
  .leaflet-popup-content-wrapper { background:#1A1208; border:1px solid rgba(200,134,10,0.5); border-radius:10px; color:#E8DCC8; }
  .leaflet-popup-tip { background:#1A1208; }
  .leaflet-popup-content { margin:10px 14px; font-family:'Noto Serif JP',serif; }
  .map-popup-name  { font-size:13px; font-weight:900; margin-bottom:4px; }
  .map-popup-chara { font-size:10px; margin-bottom:8px; }
  .map-popup-btn { width:100%; padding:8px; font-size:12px; font-weight:700; border-radius:6px; border:none; cursor:pointer; font-family:'Noto Serif JP',serif; letter-spacing:0.1em; }
</style>
</head>
<body>

<header>
  <div class="header-label">超幕末</div>
  <div class="header-title">土佐よさ恋スタンプ帳</div>
  <div class="header-count" id="countLabel">0 / 27 取得</div>
</header>

<div class="tab-bar">
  <button class="tab-btn active" id="tabBtnMap"   onclick="switchTab('map')">🗺️ 地図</button>
  <button class="tab-btn"        id="tabBtnStamp" onclick="switchTab('stamp')">📖 スタンプ帳</button>
</div>

<!-- 地図タブ -->
<div id="tab-map" class="show">
  <div class="gps-bar" id="gpsBar" style="margin:10px;border-radius:8px;">
    <div>
      <div class="gps-status off" id="gpsStatus">○ GPS停止中</div>
      <div class="gps-coords" id="gpsCoords"></div>
      <div class="gps-town"   id="gpsTown"></div>
      <div class="gps-error"  id="gpsError"></div>
    </div>
    <button class="btn-gps-start" id="gpsBtn" onclick="toggleGPS()">GPS開始</button>
  </div>
  <div style="display:flex;gap:6px;margin:0 10px 8px;">
    <button class="mode-btn" id="btnNormal" onclick="setMode('normal')" style="margin:0;">🗾 ノーマル</button>
    <button class="mode-btn" id="btnHard"   onclick="setMode('hard')"   style="margin:0;">⚔️ ハード</button>
  </div>
  <div id="map"></div>
  <div id="mapNearby"></div>
</div>

<!-- スタンプ帳タブ -->
<div id="tab-stamp">
  <div class="section">
    <div class="debug-panel">
      <div class="debug-label">🛸 デバッグ：市町村外スポットのシミュレート</div>
      <div class="debug-btns" id="debugBtns"></div>
    </div>
  </div>
  <div class="section">
    <div class="stamp-book">
      <div class="stamp-book-title">
        <span>スタンプ帳</span>
        <span id="filterLabel" style="font-size:10px;color:#C8A870;">全て表示</span>
      </div>
      <div class="char-tabs" id="charTabs"></div>
      <div class="stamp-grid" id="stampGrid"></div>
    </div>
  </div>
</div>

<div id="popupArea"></div>

<script>
const CHARS = {
  yoshida:  { name:"吉田東洋",    emoji:"📜", color:"#4A7A8A" },
  itagaki:  { name:"板垣退助",    emoji:"✊", color:"#8A6A20" },
  goto:     { name:"後藤象二郎",  emoji:"🕶️", color:"#5B8FA8" },
  ryoma:    { name:"坂本龍馬",    emoji:"⚓", color:"#C8860A" },
  nakaoka:  { name:"中岡慎太郎",  emoji:"👊", color:"#7B3F3F" },
  takechi:  { name:"武市半平太",  emoji:"⚔️", color:"#3D5A3E" },
  izo:      { name:"岡田以蔵",    emoji:"🍡", color:"#6B4F8A" },
  iwasaki:  { name:"岩崎弥太郎",  emoji:"💴", color:"#4A6A4A" },
  manjiro:  { name:"ジョン万次郎",emoji:"🌊", color:"#2A6A8A" },
  yodo:     { name:"山内容堂",    emoji:"🍶", color:"#7A3A3A" },
  tani:     { name:"谷干城",      emoji:"🏯", color:"#8B6914" },
};

const SPOTS = [
  { id:"yoshida_junan",    char:"yoshida",  name:"吉田東洋殉難之地",        lat:33.5608629, lng:133.5377231, radius:80,  town:null },
  { id:"itagaki_tei",      char:"itagaki",  name:"板垣退助邸跡",             lat:33.5459326, lng:133.5595752, radius:80,  town:null },
  { id:"itagaki_zo",       char:"itagaki",  name:"板垣退助先生像",           lat:33.5608167, lng:133.5325594, radius:80,  town:null },
  { id:"itagaki_tanjo",    char:"itagaki",  name:"板垣退助先生誕生の地",     lat:33.5581292, lng:133.5371238, radius:80,  town:null },
  { id:"goto_tanjo",       char:"goto",     name:"後藤象二郎先生誕生之地",   lat:33.5564524, lng:133.5372246, radius:80,  town:null },
  { id:"goto_minken",      char:"goto",     name:"高知市立自由民権記念館",   lat:33.5431310, lng:133.5502860, radius:100, town:null },
  { id:"ryoma_tanjo",      char:"ryoma",    name:"坂本龍馬誕生地",           lat:33.5571713, lng:133.5259210, radius:80,  town:null },
  { id:"ryoma_saitaniya",  char:"ryoma",    name:"才谷屋跡",                 lat:33.5568995, lng:133.5222595, radius:80,  town:null },
  { id:"ryoma_machi",      char:"ryoma",    name:"龍馬の生まれたまち記念館", lat:33.5565000, lng:133.5245000, radius:100, town:null },
  { id:"ryoma_museum",     char:"ryoma",    name:"高知県立坂本龍馬記念館",   lat:33.4964655, lng:133.5719482, radius:100, town:null },
  { id:"ryoma_zo",         char:"ryoma",    name:"坂本龍馬像",               lat:33.4986187, lng:133.5754821, radius:100, town:null },
  { id:"nakaoka_kan",      char:"nakaoka",  name:"中岡慎太郎館",             lat:33.4564402, lng:134.0569584, radius:100, town:"北川村" },
  { id:"nakaoka_seika",    char:"nakaoka",  name:"中岡慎太郎生家",           lat:33.4571961, lng:134.0561382, radius:100, town:"北川村" },
  { id:"nakaoka_zo",       char:"nakaoka",  name:"中岡慎太郎之像",           lat:33.2457735, lng:134.1762621, radius:100, town:"室戸市" },
  { id:"takechi_junsetsu", char:"takechi",  name:"武市瑞山殉節の地の碑",     lat:33.5598891, lng:133.5355396, radius:80,  town:null },
  { id:"takechi_tei",      char:"takechi",  name:"武市半平太邸跡",           lat:33.5602837, lng:133.5478792, radius:80,  town:null },
  { id:"izo_momiji",       char:"izo",      name:"紅葉橋",                   lat:33.5523743, lng:133.5051352, radius:100, town:null },
  { id:"izo_haka",         char:"izo",      name:"岡田以蔵の墓",             lat:33.5803490, lng:133.5521741, radius:100, town:null },
  { id:"iwasaki_zo",       char:"iwasaki",  name:"岩崎弥太郎像",             lat:33.5258400, lng:133.9004710, radius:100, town:"安芸市" },
  { id:"iwasaki_seika",    char:"iwasaki",  name:"岩崎弥太郎生家",           lat:33.5260380, lng:133.8999868, radius:100, town:"安芸市" },
  { id:"manjiro_kan",      char:"manjiro",  name:"ジョン万次郎資料館",       lat:32.7813734, lng:132.9326612, radius:100, town:"土佐清水市" },
  { id:"manjiro_seika",    char:"manjiro",  name:"ジョン万次郎生家",         lat:32.7593775, lng:132.9645816, radius:100, town:"土佐清水市" },
  { id:"manjiro_zo",       char:"manjiro",  name:"中浜万次郎像",             lat:32.7255834, lng:133.0195690, radius:100, town:"土佐清水市" },
  { id:"yodo_tei",         char:"yodo",     name:"山内容堂邸跡",             lat:33.5562204, lng:133.5328997, radius:80,  town:null },
  { id:"yodo_tanjo",       char:"yodo",     name:"山内容堂公誕生之地の碑",   lat:33.5609440, lng:133.5345901, radius:80,  town:null },
  { id:"yodo_kochi",       char:"yodo",     name:"高知城",                   lat:33.5608125, lng:133.5314844, radius:150, town:null },
  { id:"tani_figure",      char:"tani",     name:"谷干城フィギュア像",       lat:33.2087536, lng:133.1360827, radius:100, town:"四万十町" },
  { id:"tani_tanjo",       char:"tani",     name:"谷干城生誕地石碑",         lat:33.2100660, lng:133.1318160, radius:100, town:"四万十町" },
];

const CITY_SHOW_LIMIT = 5;

function loadStamps(){ try{const r=localStorage.getItem("stamps_v1");if(r)return JSON.parse(r);}catch(e){} const init={};SPOTS.forEach(s=>init[s.id]=false);return init; }
function saveStamps(s){ try{localStorage.setItem("stamps_v1",JSON.stringify(s));}catch(e){} }
function loadMode(){ try{return localStorage.getItem("mode_v1")||"normal";}catch(e){return "normal";} }
function saveMode(m){ try{localStorage.setItem("mode_v1",m);}catch(e){} }

let stamps=loadStamps(), mode=loadMode();
let userPos=null, watchId=null, tracking=false;
let currentTown="", debugSpot=null, debugTown=null;
let distances={}, filterChar="all";
let townFetchTimer=null;
let currentTab="map";

// ── Leaflet地図 ───────────────────────────────────────────
const map = L.map('map').setView([33.56, 133.53], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors', maxZoom:19
}).addTo(map);

let userMarker = null;
let spotMarkers = {};

// キャラカラーのカスタムピン
function makeIcon(color, got){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="28" height="36" viewBox="0 0 28 36">
    <path d="M14 0C6.3 0 0 6.3 0 14c0 9.8 14 22 14 22s14-12.2 14-22C28 6.3 21.7 0 14 0z"
      fill="${got?"#555":color}" stroke="white" stroke-width="1.5"/>
    <circle cx="14" cy="14" r="6" fill="white" opacity="${got?0.3:0.9}"/>
  </svg>`;
  return L.divIcon({
    html: svg, className:'', iconSize:[28,36], iconAnchor:[14,36], popupAnchor:[0,-36]
  });
}

function updateMapMarkers(){
  SPOTS.forEach(s=>{
    const c=CHARS[s.char];
    const got=stamps[s.id];
    const inRange=isInRange(s);
    if(spotMarkers[s.id]){
      spotMarkers[s.id].setIcon(makeIcon(c.color, got));
    } else {
      const m=L.marker([s.lat,s.lng],{icon:makeIcon(c.color,got)}).addTo(map);
      m.bindPopup(makePopupHtml(s));
      m.on('click',()=>{ m.setPopupContent(makePopupHtml(s)); });
      spotMarkers[s.id]=m;
    }
  });
}

function makePopupHtml(s){
  const c=CHARS[s.char];
  const got=stamps[s.id];
  const inRange=isInRange(s);
  const btnHtml=inRange
    ? `<button class="map-popup-btn" onclick="getStamp('${s.id}')"
        style="background:${got?"rgba(60,60,60,0.8)":`${c.color}`};color:${got?"#888":"#0D0D0D"};"
        ${got?"disabled":""}>
        ${got?"✓ 取得済み":"🔖 スタンプを押す"}
       </button>`
    : `<div style="font-size:10px;color:#8A7A60;text-align:center;">現地で押せます</div>`;
  return `<div>
    <div class="map-popup-name" style="color:${c.color}">${s.name}</div>
    <div class="map-popup-chara" style="color:${c.color}">${c.emoji} ${c.name}</div>
    ${btnHtml}
  </div>`;
}

function updateUserMarker(){
  const pos=debugSpot||userPos;
  if(!pos){ if(userMarker){map.removeLayer(userMarker);userMarker=null;} return; }
  const blueIcon=L.divIcon({
    html:`<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20">
      <circle cx="10" cy="10" r="8" fill="#4A90E2" stroke="white" stroke-width="2"/>
      <circle cx="10" cy="10" r="3" fill="white"/>
    </svg>`,
    className:'', iconSize:[20,20], iconAnchor:[10,10]
  });
  if(userMarker){ userMarker.setLatLng([pos.lat,pos.lng]); }
  else { userMarker=L.marker([pos.lat,pos.lng],{icon:blueIcon,zIndexOffset:1000}).addTo(map); }
  map.setView([pos.lat,pos.lng],15);
}

// ── 市町村API ─────────────────────────────────────────────
async function fetchTown(lat,lng){
  try{
    const url=`https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress?lon=${lng}&lat=${lat}`;
    const r=await fetch(url);
    const d=await r.json();
    const muniNm=d?.results?.muniNm||"";
    const parts=muniNm.split(" ");
    currentTown=parts[parts.length-1]||"";
    document.getElementById("gpsTown").textContent=currentTown?"📍 "+currentTown:"";
    renderNearby(); renderMapNearby(); updateMapMarkers();
  }catch(e){ currentTown=""; }
}

// ── 距離計算 ──────────────────────────────────────────────
function getDistance(la1,ln1,la2,ln2){
  const R=6371000,dL=(la2-la1)*Math.PI/180,dG=(ln2-ln1)*Math.PI/180;
  const a=Math.sin(dL/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dG/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function distLabel(m){ return m>=1000?(m/1000).toFixed(1)+"km":m+"m"; }

function updateDistances(){
  const pos=debugSpot||userPos;
  if(!pos){distances={};return;}
  SPOTS.forEach(s=>{ distances[s.id]=Math.round(getDistance(pos.lat,pos.lng,s.lat,s.lng)); });
}

function isInRange(s){
  const town=debugTown||currentTown;
  if(mode==="hard") return distances[s.id]!==undefined && distances[s.id]<=s.radius;
  if(s.town) return town===s.town;
  return distances[s.id]!==undefined && distances[s.id]<=s.radius;
}

function getVisibleSpots(){
  const pos=debugSpot||userPos;
  const town=debugTown||currentTown;
  if(!pos && !town) return [];
  const outerVisible=SPOTS.filter(s=>s.town&&(debugTown===s.town||currentTown===s.town));
  const citySpots=SPOTS.filter(s=>!s.town&&distances[s.id]!==undefined)
    .sort((a,b)=>distances[a.id]-distances[b.id]).slice(0,CITY_SHOW_LIMIT);
  return [...outerVisible,...citySpots];
}
